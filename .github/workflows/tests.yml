# Runs the full test suite on GitHub for every push and pull request: the Python
# engine and data (pytest), then the browser engine (Node's test runner).
# The CIA MI-2024 tests skip here (that file is never committed); everything else runs
# against the cleaned data in data/clean/.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install packages
        run: pip install "numpy>=2.0" "pandas>=2.2" "openpyxl>=3.1" "pytest>=8.0" "pypdf>=6.0"
      - name: Run tests
        run: pytest -v
      - name: Run the browser engine's tests (Node, already on the runner)
        run: node --test web/tests/engine.test.mjs
