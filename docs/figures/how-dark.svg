<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>How one life is lived: answers, death rates, then each year events and a death check, repeated 1,000 times</title>
<rect width="960" height="250" rx="12" fill="#0d1117"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9198a1"/></marker></defs>
<text x="20.0" y="40.0" font-size="22" font-weight="700" fill="#f0f6fc" text-anchor="start">How one life is lived</text>
<rect x="20.0" y="66" width="160" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="42.0" cy="90" r="11" fill="#3987e5"/>
<text x="42.0" y="94.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="60.0" y="95.0" font-size="14.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Your answers</text>
<text x="100.0" y="128.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">smoking, activity,</text>
<text x="100.0" y="147.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">height and weight,</text>
<text x="100.0" y="166.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">drinks, fruit and veg</text>
<line x1="183.0" y1="130.0" x2="207.0" y2="130.0" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="210.0" y="66" width="160" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="232.0" cy="90" r="11" fill="#3987e5"/>
<text x="232.0" y="94.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="250.0" y="95.0" font-size="14.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Your death rates</text>
<text x="290.0" y="128.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">StatCan life table</text>
<text x="290.0" y="147.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">× your habits, improved</text>
<text x="290.0" y="166.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">with CIA MI-2024</text>
<line x1="373.0" y1="130.0" x2="397.0" y2="130.0" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="400.0" y="66" width="160" height="128" rx="10" fill="#161b22" stroke="#3987e5" stroke-width="2"/>
<circle cx="422.0" cy="90" r="11" fill="#3987e5"/>
<text x="422.0" y="94.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="440.0" y="95.0" font-size="14.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Live one year</text>
<text x="480.0" y="128.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">crash, cancer, heart attack,</text>
<text x="480.0" y="147.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">stroke, disability, marriage,</text>
<text x="480.0" y="166.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">child, retirement</text>
<line x1="563.0" y1="130.0" x2="587.0" y2="130.0" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="590.0" y="66" width="160" height="128" rx="10" fill="#161b22" stroke="#3987e5" stroke-width="2"/>
<circle cx="612.0" cy="90" r="11" fill="#3987e5"/>
<text x="612.0" y="94.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="630.0" y="95.0" font-size="14.5" font-weight="700" fill="#f0f6fc" text-anchor="start">Death this year?</text>
<text x="670.0" y="128.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">the chance depends on</text>
<text x="670.0" y="147.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">everything that has</text>
<text x="670.0" y="166.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">happened so far</text>
<line x1="753.0" y1="130.0" x2="777.0" y2="130.0" stroke="#9198a1" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="780.0" y="66" width="160" height="128" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="802.0" cy="90" r="11" fill="#3987e5"/>
<text x="802.0" y="94.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="820.0" y="95.0" font-size="14.5" font-weight="700" fill="#f0f6fc" text-anchor="start">1,000 lives</text>
<text x="860.0" y="128.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">repeat from today,</text>
<text x="860.0" y="147.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">1,000 times: the range</text>
<text x="860.0" y="166.0" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">of ages and causes</text>
<path d="M670.0 196V220H480.0V200" fill="none" stroke="#3987e5" stroke-width="2" marker-end="url(#a)"/>
<text x="575.0" y="238.0" font-size="12.5" font-weight="600" fill="#3987e5" text-anchor="middle">survives: next year</text>
<text x="765.0" y="120.0" font-size="11.5" font-weight="600" fill="#9198a1" text-anchor="middle">dies</text>
</svg>
